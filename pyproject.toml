[project]
name = "react-agent"
version = "0.1.0"
description = "A lightweight ReAct agent framework without LangChain dependency."
readme = "README.md"
authors = [
    { name = "S1rryNut", email = "147057327+S1rryNut@users.noreply.github.com" }
]
requires-python = ">=3.13.5"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.7.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.uv.build-backend]
packages = ["react_agent"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
